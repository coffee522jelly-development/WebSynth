<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Synthesizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 id="app-title">Web Audio Synthesizer</h1>
    <div id="control-panel">
        <section id="oscillator">
            <h2>Oscillator</h2>
            <label><input type="radio" name="waveform" value="sine" checked> Sine</label>
            <label><input type="radio" name="waveform" value="square"> Square</label>
            <label><input type="radio" name="waveform" value="sawtooth"> Sawtooth</label>
            <label><input type="radio" name="waveform" value="triangle"> Triangle</label>
            <canvas id="waveform-canvas" width="100" height="50" style="margin-top: 10px;"></canvas>
        </section>

        <section id="volume">
            <h2>Volume</h2>
            <label for="master-volume">Master Volume</label>
            <input type="range" id="master-volume" name="master-volume" min="0" max="1" step="0.01" value="0.7">
        </section>

        <section id="envelope">
            <h2>Envelope</h2>
            <label for="attack">Attack</label>
            <input type="range" id="attack" name="attack" min="0" max="2" step="0.01" value="0.1">
            <label for="decay">Decay</label>
            <input type="range" id="decay" name="decay" min="0" max="2" step="0.01" value="0.1">
            <label for="sustain">Sustain</label>
            <input type="range" id="sustain" name="sustain" min="0" max="1" step="0.01" value="0.7">
            <label for="release">Release</label>
            <input type="range" id="release" name="release" min="0" max="2" step="0.01" value="0.1">
        </section>

        <section id="filter">
            <h2>Filter</h2>
            <label for="filter-type">Type</label>
            <select id="filter-type" name="filter-type">
                <option value="lowpass">Lowpass</option>
                <option value="highpass">Highpass</option>
                <option value="bandpass">Bandpass</option>
                <option value="notch">Notch</option>
            </select>
            <label for="filter-frequency">Frequency</label>
            <input type="range" id="filter-frequency" name="filter-frequency" min="20" max="20000" step="1" value="1000">
            <label for="filter-q">Q</label>
            <input type="range" id="filter-q" name="filter-q" min="0.1" max="20" step="0.1" value="1">
        </section>

        <section id="lfo">
            <h2>LFO</h2>
            <label for="lfo-target">Target</label>
            <select id="lfo-target" name="lfo-target">
                <option value="volume">Volume</option>
                <option value="filter-frequency">Filter Frequency</option>
            </select>
            <label for="lfo-frequency">Frequency</label>
            <input type="range" id="lfo-frequency" name="lfo-frequency" min="0.1" max="20" step="0.1" value="1">
            <label for="lfo-depth">Depth</label>
            <input type="range" id="lfo-depth" name="lfo-depth" min="0" max="1" step="0.01" value="0.5">
        </section>
    </div>

    <div id="keyboard-panel">
        <!-- Virtual piano keyboard will be generated here by JavaScript -->
    </div>

    <div id="sequencer-panel">
        <h2>Step Sequencer</h2>
        <div id="sequencer-controls">
            <button id="seq-play-pause-button" disabled>Play</button> <!-- Start disabled -->
            <label for="seq-tempo">Tempo:</label>
            <input type="range" id="seq-tempo" name="seq-tempo" min="40" max="240" value="120">
            <span id="seq-tempo-value">120 BPM</span>
            <button id="metronome-toggle">Metronome: Off</button>
            <label for="seq-current-step">Current Step:</label>
            <span id="seq-current-step-display">-</span>
            <!-- Add more controls here later e.g. clear sequence, swing, etc. -->
        </div>

        <div id="sequencer-grid">
            <!-- Steps 0 through 31 will be structured similarly, typically generated by JavaScript. -->
            <!-- Example structure (now fully generated by JS):
            <div class="sequencer-step" data-step-id="0">
                <label class="step-label">1</label>
                <input type="checkbox" class="seq-note-on" id="step-note-on-0" name="step-note-on-0" title="Step 1 On/Off">
                <label for="step-note-on-0" class="sr-only">Step 1 Note On/Off</label>
                <input type="number" class="seq-pitch" id="step-pitch-0" name="step-pitch-0" min="24" max="96" value="60" title="Step 1 Pitch (MIDI)">
                <label for="step-pitch-0" class="sr-only">Step 1 Pitch</label>
            </div>
            -->
        </div>
    </div>

    <div id="drum-machine-panel">
        <h2>Drum Machine</h2>
        <div id="drum-machine-grid">
            <!-- Drum machine steps (e.g., 3 rows for Kick, Snare, Hi-Hat, 32 steps each) -->
            <!-- will be dynamically generated here by JavaScript -->
        </div>
    </div>

    <div id="drum-editor-panel">
        <h2>Drum Sound Editor</h2>
        <div class="tab-navigation">
            <button class="tab-button active-tab" data-tab-target="#bd-editor-content">Bass Drum</button>
            <button class="tab-button" data-tab-target="#sn-editor-content">Snare</button>
            <button class="tab-button" data-tab-target="#hh-editor-content">Hi-Hat</button>
        </div>

        <div id="bd-editor-content" class="tab-content active-content">
            <h3>Bass Drum Parameters</h3>
            <!-- Input controls for Bass Drum will go here -->
            <p>BD controls placeholder...</p>
        </div>
        <div id="sn-editor-content" class="tab-content" style="display: none;">
            <h3>Snare Parameters</h3>
            <!-- Input controls for Snare will go here -->
            <p>Snare controls placeholder...</p>
        </div>
        <div id="hh-editor-content" class="tab-content" style="display: none;">
            <h3>Hi-Hat Parameters</h3>
            <!-- Input controls for Hi-Hat will go here -->
            <p>HH controls placeholder...</p>
        </div>
    </div> <!-- Closing drum-editor-panel -->

    <script src="main.js"></script>
</body>
</html>
